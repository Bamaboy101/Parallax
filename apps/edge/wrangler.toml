# Kept from before the rename: a new Worker name would mean a new workers.dev address and
# re-entering its secrets, for a name no visitor sees.
name = "open-terminal-edge"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[vars]
# Origins allowed to call the edge. `https://*.host` matches subdomains (Pages previews).
# parallax-markets.pages.dev is the site (renamed from open-terminal on 18 Nov 2026).
# open-terminal.pages.dev stays allowed until 18 Dec 2026, while the old address redirects people.
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173,https://parallax-markets.pages.dev,https://*.parallax-markets.pages.dev,https://open-terminal.pages.dev,https://*.open-terminal.pages.dev"

# Secrets, never in this file (set once with `wrangler secret put <NAME>`):
# - FRED_API_KEY: the project's FRED key.
# - SEC_USER_AGENT: "<name> <contact email>", which SEC asks every client to declare. Kept out of
#   the repo because it holds an email address. /sec answers 503 until it is set.
