<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parallax</title>
    <meta
      name="description"
      content="A free market terminal in your browser: what's happening in markets right now, with every number's source and age."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Parallax — Free, open-source market terminal" />
    <meta
      property="og:description"
      content="One market. More perspective. Live markets, a plain-language daily brief, and a full cockpit. Free and open source."
    />
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/Bamaboy101/Parallax/launch-visual/docs/brand/social-preview.png"
    />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta
      property="og:image:alt"
      content="Parallax — Free, open-source market terminal over Mission Control"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Parallax — Free, open-source market terminal" />
    <meta
      name="twitter:description"
      content="One market. More perspective. Live markets, a plain-language daily brief, and a full cockpit. Free and open source."
    />
    <meta
      name="twitter:image"
      content="https://raw.githubusercontent.com/Bamaboy101/Parallax/launch-visual/docs/brand/social-preview.png"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f0f0f0" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      (() => {
        let theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        try {
          // Before the rename (18 Nov 2026) the theme was saved as open-terminal:theme.
          const saved =
            localStorage.getItem('parallax:theme') ?? localStorage.getItem('open-terminal:theme');
          if (saved === 'dark' || saved === 'light') theme = saved;
        } catch {
          // Storage may be blocked; the system preference still applies.
        }
        const root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        root.style.backgroundColor = theme === 'dark' ? '#0d0d0d' : '#f0f0f0';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
