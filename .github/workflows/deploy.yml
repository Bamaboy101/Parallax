name: Deploy

# Deploys the web app to Cloudflare Pages after CI passes on main, or on manual dispatch.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: false

env:
  PAGES_PROJECT: open-terminal

jobs:
  pages:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @open-terminal/web build
      - name: Ensure Pages project exists
        working-directory: apps/edge
        run: |
          if ! pnpm exec wrangler pages project list --json | grep -Fq "\"$PAGES_PROJECT\""; then
            pnpm exec wrangler pages project create "$PAGES_PROJECT" --production-branch main
          fi
      - name: Deploy to Cloudflare Pages
        working-directory: apps/edge
        run: >-
          pnpm exec wrangler pages deploy ../web/dist
          --project-name "$PAGES_PROJECT"
          --branch main
          --commit-hash "$DEPLOY_SHA"

  # The edge Worker (apps/edge). Its secrets (FRED_API_KEY, SEC_USER_AGENT) live in Cloudflare
  # and survive deploys; this job only uploads code and the [vars] in wrangler.toml.
  worker:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy the edge Worker
        working-directory: apps/edge
        run: pnpm exec wrangler deploy
