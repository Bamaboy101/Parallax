name: Deploy

# Deploys the web app to Cloudflare Pages after CI passes on main, or on manual dispatch.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: false

env:
  PAGES_PROJECT: parallax-terminal
  # The two earlier addresses keep serving the same build, with a banner pointing to the new one,
  # until 18 Dec 2026. Remove this line (and its loop entries below) after that date.
  LEGACY_PAGES_PROJECTS: open-terminal parallax-markets

jobs:
  pages:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @parallax/web build
      - name: Ensure Pages projects exist
        working-directory: apps/edge
        run: |
          projects=$(pnpm exec wrangler pages project list --json)
          for project in "$PAGES_PROJECT" $LEGACY_PAGES_PROJECTS; do
            if ! grep -Fq "\"$project\"" <<<"$projects"; then
              # --force: without it, wrangler now creates a Worker, which has no pages.dev address.
              pnpm exec wrangler pages project create "$project" --production-branch main --force
            fi
          done
      - name: Deploy to Cloudflare Pages
        working-directory: apps/edge
        run: |
          for project in "$PAGES_PROJECT" $LEGACY_PAGES_PROJECTS; do
            pnpm exec wrangler pages deploy ../web/dist \
              --project-name "$project" \
              --branch main \
              --commit-hash "$DEPLOY_SHA"
          done

  # The edge Worker (apps/edge). Its secrets (FRED_API_KEY, SEC_USER_AGENT) live in Cloudflare
  # and survive deploys; this job only uploads code and the [vars] in wrangler.toml.
  worker:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy the edge Worker
        working-directory: apps/edge
        run: pnpm exec wrangler deploy
